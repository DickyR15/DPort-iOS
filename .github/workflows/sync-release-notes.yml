name: Sync release notes

on:
  push:
    paths:
      - .github/workflows/sync-release-notes.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update DPort iOS release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dport-ios-6.9.0.md <<'EOF'
## ✨ 版本內容

- GPS 位置模擬與定位更新
- GPS 搖桿與步行／跑步／腳踏車／開車模式
- LocalDevVPN 狀態與連線提示
- 附近地點搜尋
- 地圖繪製路徑
- 路線規劃
- GPX 匯入、匯出與路線播放
- 我的最愛與最近使用
- 定位圖釘保留
- 繁體中文（台灣）介面
- DPort 品牌與介面調整

## 📦 下載

`DPort-6.9.0-TW.ipa`

此 IPA 為**未簽署版本**，不包含 Apple Developer / App Store 正式簽章。

使用者需依自身裝置與環境使用適用的合法簽署／側載方式。

## 📚 原始碼與上游

本 Release 對應 Git Tag `6.9.0`。

GitHub Repository：

https://github.com/DickyR15/DPort-iOS

DPort iOS 基於開源專案 **Locus** 進行修改與再開發。

Locus：

https://github.com/ChrisMack32/Locus

Locus 採用 **MIT License**。

DPort-specific modifications include DPort branding, Traditional Chinese (Taiwan) localization,
UI adjustments, build/packaging changes and other project-specific changes.

## ⚖️ 授權

Locus 原始程式碼、原始著作權聲明與 MIT License 仍然適用。

DPort 原創修改依 Repository 所載 MIT License 處理。

完整授權：

https://github.com/DickyR15/DPort-iOS/blob/6.9.0/LICENSE

第三方授權與來源：

https://github.com/DickyR15/DPort-iOS/blob/6.9.0/THIRD_PARTY_NOTICES.md

## 🏷️ 商標與 Apple 聲明

DPort iOS 並非 Apple 官方產品，也不表示 Apple 背書、贊助、認證或官方合作。

Apple、iPhone、iPad、iOS、iPadOS 及相關商標屬 Apple Inc. 或相關權利人所有。

本軟體授權不授予任何第三方商標權。

## ⚠️ 免責聲明

DPort iOS 依「現況」提供。實際功能可能受到 iOS／iPadOS、裝置、Developer Mode、
配對狀態、開發者通道、第三方工具及平台變更影響。

使用者應自行確認使用方式符合所在地適用法律、相關服務條款及第三方授權。

© 2026 DickyR15 / DPort.
EOF

          gh release edit 6.9.0 --repo "${GITHUB_REPOSITORY}" --notes-file /tmp/dport-ios-6.9.0.md --title "DPort 6.9.0" --latest

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sync-release-notes.yml
          git add -A
          git commit -m "chore: remove one-time release note sync workflow" || true
          git push

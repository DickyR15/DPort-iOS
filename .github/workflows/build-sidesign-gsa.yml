name: Build SideStore with GSA transport fix

on:
  push:
    branches: [gsa-sidesign-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Clone SideStore 9b015d1f
        run: |
          git clone https://github.com/SideStore/SideStore.git SideStore
          cd SideStore
          git fetch --depth=1 origin 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
          git checkout --detach 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
          git submodule update --init --recursive

      - name: Apply GSA transport patch to current SideSign
        working-directory: SideStore
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift')
          s = auth.read_text()
          old = '''        let (data, response): (Data, URLResponse)\n        do {\n            (data, response) = try await session.data(for: request)\n        } catch {\n'''
          new = '''        let (data, response): (Data, URLResponse)\n        do {\n            if let operation = requestParameters["o"] as? String,\n               ["init", "complete", "apptokens"].contains(operation) {\n                (data, response) = try await GrandSlamTransport.data(for: request)\n            } else {\n                (data, response) = try await session.data(for: request)\n            }\n        } catch {\n'''
          if old not in s:
              raise SystemExit('Authentication.swift target block not found')
          auth.write_text(s.replace(old, new, 1))
          PY

          cat > Dependencies/SideSign/Sources/DeveloperPortal/GrandSlamTransport.swift <<'SWIFT'
          import Foundation
          #if canImport(FoundationNetworking)
          import FoundationNetworking
          #endif

          /// Transport for the three GrandSlam authentication exchanges, not general portal requests.
          enum GrandSlamTransport {
              static func data(
                  for request: URLRequest,
                  makeSession: @Sendable (URLSessionConfiguration) -> URLSession = { URLSession(configuration: $0) },
                  sleep: @Sendable (UInt64) async throws -> Void = { try await Task.sleep(nanoseconds: $0) }
              ) async throws -> (Data, URLResponse) {
                  let retryDelays: [UInt64] = [1, 2, 4, 8]
                  var attempt = 0

                  while true {
                      try Task.checkCancellation()

                      let configuration = URLSessionConfiguration.ephemeral
                      configuration.urlCache = nil
                      configuration.httpCookieStorage = nil
                      configuration.urlCredentialStorage = nil
                      configuration.requestCachePolicy = .reloadIgnoringLocalCacheData

                      let session = makeSession(configuration)
                      let result: (Data, URLResponse)
                      do {
                          defer { session.finishTasksAndInvalidate() }
                          result = try await session.data(for: request)
                      }

                      try Task.checkCancellation()

                      guard let response = result.1 as? HTTPURLResponse,
                            (500...599).contains(response.statusCode) else {
                          return result
                      }

                      guard attempt < retryDelays.count else {
                          throw NSError(
                              domain: NSURLErrorDomain,
                              code: NSURLErrorBadServerResponse,
                              userInfo: [
                                  NSLocalizedDescriptionKey: "Apple's authentication server returned HTTP \(response.statusCode) after \(attempt + 1) attempts. Please try again later.",
                                  "HTTPStatusCode": response.statusCode,
                                  "ContentType": response.value(forHTTPHeaderField: "Content-Type") ?? "unknown"
                              ]
                          )
                      }

                      try await sleep(retryDelays[attempt] * 1_000_000_000)
                      attempt += 1
                  }
              }
          }
          SWIFT

          grep -n "GrandSlamTransport.data" Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift
          sed -n '1,120p' Dependencies/SideSign/Sources/DeveloperPortal/GrandSlamTransport.swift

      - name: Build SideStore
        working-directory: SideStore
        run: |
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build.log
          make ipa 2>&1 | tee -a build.log
          ls -lh SideStore.ipa

      - name: Upload patched SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-9b015d1f-GSA-transport-fixed
          path: |
            SideStore/SideStore.ipa
            SideStore/build.log
          if-no-files-found: error

      - name: Upload patched SideSign source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SideSign-GSA-transport-fixed-source
          path: SideStore/Dependencies/SideSign
          if-no-files-found: error

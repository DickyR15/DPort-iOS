name: Build SideStore with GSA transport fix

on:
  push:
    branches: [gsa-sidesign-build]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Clone SideStore 9b015d1f
        run: |
          git clone https://github.com/SideStore/SideStore.git SideStore
          cd SideStore
          git fetch --depth=1 origin 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
          git checkout --detach 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
          git submodule update --init --recursive

      - name: Apply GSA transport patch to current SideSign
        working-directory: SideStore
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift')
          s = auth.read_text()
          old = '''        let (data, response): (Data, URLResponse)\n        do {\n            (data, response) = try await session.data(for: request)\n        } catch {\n'''
          new = '''        let (data, response): (Data, URLResponse)\n        do {\n            if let operation = requestParameters["o"] as? String,\n               ["init", "complete", "apptokens"].contains(operation) {\n                (data, response) = try await GrandSlamTransport.data(for: request)\n            } else {\n                (data, response) = try await session.data(for: request)\n            }\n        } catch {\n'''
          if old not in s:
              raise SystemExit('Authentication.swift target block not found')
          s = s.replace(old, new, 1)
          auth.write_text(s)

          transport = Path('Dependencies/SideSign/Sources/DeveloperPortal/GrandSlamTransport.swift')
          transport.write_text(r'''import Foundation\n#if canImport(FoundationNetworking)\nimport FoundationNetworking\n#endif\n\n/// Transport for the three GrandSlam authentication exchanges, not general portal requests.\nenum GrandSlamTransport {\n    static func data(\n        for request: URLRequest,\n        makeSession: @Sendable (URLSessionConfiguration) -> URLSession = { URLSession(configuration: $0) },\n        sleep: @Sendable (UInt64) async throws -> Void = { try await Task.sleep(nanoseconds: $0) }\n    ) async throws -> (Data, URLResponse) {\n        let retryDelays: [UInt64] = [1, 2, 4, 8]\n        var attempt = 0\n\n        while true {\n            try Task.checkCancellation()\n            // Apple's GSA edge can pin a persistent connection to a failing backend.\n            // Each attempt needs its own connection pool, including the initial request.\n            let configuration = URLSessionConfiguration.ephemeral\n            configuration.urlCache = nil\n            configuration.httpCookieStorage = nil\n            configuration.urlCredentialStorage = nil\n            configuration.requestCachePolicy = .reloadIgnoringLocalCacheData\n            let session = makeSession(configuration)\n            let result: (Data, URLResponse)\n            do {\n                defer { session.finishTasksAndInvalidate() }\n                result = try await session.data(for: request)\n            }\n            try Task.checkCancellation()\n\n            guard let response = result.1 as? HTTPURLResponse,\n                  (500...599).contains(response.statusCode) else {\n                return result\n            }\n\n            guard attempt < retryDelays.count else {\n                throw NSError(domain: NSURLErrorDomain, code: NSURLErrorBadServerResponse, userInfo: [\n                    NSLocalizedDescriptionKey: "Apple's authentication server returned HTTP \\(response.statusCode) after \\(attempt + 1) attempts. Please try again later.",\n                    "HTTPStatusCode": response.statusCode,\n                    "ContentType": response.value(forHTTPHeaderField: "Content-Type") ?? "unknown"\n                ])\n            }\n\n            try await sleep(retryDelays[attempt] * 1_000_000_000)\n            attempt += 1\n        }\n    }\n}\n''')
          PY
          grep -n "GrandSlamTransport.data" Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift
          test -f Dependencies/SideSign/Sources/DeveloperPortal/GrandSlamTransport.swift
          echo "Patched current SideSign submodule in-place"

      - name: Build SideStore
        working-directory: SideStore
        run: |
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build.log
          make ipa 2>&1 | tee -a build.log
          ls -lh SideStore.ipa

      - name: Upload patched SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-9b015d1f-GSA-PR1-current-SideSign
          path: |
            SideStore/SideStore.ipa
            SideStore/build.log
          if-no-files-found: error

      - name: Upload patched SideSign source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SideSign-GSA-PR1-current-SideSign-source
          path: SideStore/Dependencies/SideSign
          if-no-files-found: error

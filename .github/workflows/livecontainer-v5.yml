name: LiveContainer V5.1 Return Fix
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      SCHEME: LiveContainer
      ARCHIVE_PATH: archive
      LC_COMMIT: 3afa9eb9a53625e9b8bd8b932e5785fd716ad5ae
      PINNED_IPA: https://github.com/LiveContainer/LiveContainer/releases/download/3.8.0/LiveContainer%2BSideStore.ipa
    steps:
      - name: Verify runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      - name: Clone LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf LiveContainer
          git clone --filter=blob:none --no-checkout https://github.com/LiveContainer/LiveContainer.git LiveContainer
          cd LiveContainer
          git fetch --depth 1 origin "$LC_COMMIT"
          git checkout --detach "$LC_COMMIT"
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Add backward-compatible SideStore return selector
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('LiveContainer/LCSharedUtils.h')
          s = h.read_text()
          marker = '+ (BOOL)launchToGuestAppWithClassicMode:(NSUInteger)classicMode;'
          compat = '+ (BOOL)launchToGuestApp;\n'
          if '+ (BOOL)launchToGuestApp;' not in s:
              if marker not in s:
                  raise SystemExit('LCSharedUtils.h selector marker not found')
              s = s.replace(marker, compat + marker, 1)
              h.write_text(s)

          m = Path('LiveContainer/LCSharedUtils.m')
          s = m.read_text()
          marker = '+ (BOOL)launchToGuestAppWithClassicMode:(NSUInteger)classicMode {'
          compat = '+ (BOOL)launchToGuestApp {\n    // Compatibility for SideStore versions that still call the old selector.\n    return [self launchToGuestAppWithClassicMode:0];\n}\n\n'
          if '+ (BOOL)launchToGuestApp {' not in s:
              if marker not in s:
                  raise SystemExit('LCSharedUtils.m selector marker not found')
              s = s.replace(marker, compat + marker, 1)
              m.write_text(s)
          PY
          grep -n -A5 -B2 'launchToGuestApp' LiveContainer/LCSharedUtils.h
          grep -n -A8 -B2 'launchToGuestApp' LiveContainer/LCSharedUtils.m | head -40

      - name: Prepare pinned SideStore and working widget
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../pinned
          mkdir -p ../pinned/extracted
          curl -fL --retry 3 "$PINNED_IPA" -o ../pinned/LiveContainer-3.8.0-SideStore.ipa
          unzip -q ../pinned/LiveContainer-3.8.0-SideStore.ipa -d ../pinned/extracted
          test -d ../pinned/extracted/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
          cp -R ../pinned/extracted/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework ../pinned/SideStoreApp.framework

          widget="$(find ../pinned/extracted/Payload/LiveContainer.app -type d \( -name 'LiveWidgetExtension.appex' -o -name 'AltWidgetExtension.appex' \) -print -quit || true)"
          echo "Stable widget candidate: ${widget:-NONE}"
          test -n "$widget"
          cp -R "$widget" ../pinned/widget.appex

      - name: Select Xcode 26.2 when available
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Patch build script to use pinned SideStore and stable widget
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/build_github.sh')
          s = p.read_text()

          start = s.index('# download SideStore')
          end = s.index('# copy intents')
          replacement = '''# SideStore pinned from LiveContainer 3.8.0 stable
          rm -rf ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
          cp -R ../pinned/SideStoreApp.framework ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework

          brew install ldid
          ldid -S"" ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore
          cp ./.github/sidelc/LCAppInfo.plist ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/

          # The stable 3.8.0 IPA already contains the widget that works on iOS.
          rm -rf ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex
          cp -R ../pinned/widget.appex ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex

          '''
          s = s[:start] + replacement + s[end:]

          alt_start = s.index('# AltWidgetExtension')
          sign_start = s.index('# Sign')
          widget_block = '''# Widget extension
          if [ -f ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/AltWidgetExtension ]; then
            mv ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/AltWidgetExtension ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/LiveWidgetExtension
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.kdt.livecontainer.LiveWidget" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.kdt.livecontainer.LiveWidget" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable LiveWidgetExtension" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string LiveWidgetExtension" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist

          '''
          s = s[:alt_start] + widget_block + s[sign_start:]
          p.write_text(s)
          PY

      - name: Detect Xcode project
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            echo "PROJECT_FLAG=-workspace" >> "$GITHUB_ENV"
            echo "PROJECT_PATH=$(ls -d *.xcworkspace | head -1)" >> "$GITHUB_ENV"
          else
            echo "PROJECT_FLAG=-project" >> "$GITHUB_ENV"
            echo "PROJECT_PATH=$(ls -d *.xcodeproj | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Archive
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -archivePath "$ARCHIVE_PATH" \
            -scheme "$SCHEME" \
            "$PROJECT_FLAG" "$PROJECT_PATH" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release | xcpretty
          test -d "$ARCHIVE_PATH.xcarchive/Products/Applications/LiveContainer.app"

      - name: Package IPA
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$ARCHIVE_PATH" scheme="$SCHEME" sh .github/build_github.sh

      - name: Verify output
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SCHEME}+SideStore.ipa"
          unzip -l "${SCHEME}+SideStore.ipa" | grep -q 'LiveWidgetExtension.appex/LiveWidgetExtension'
          echo "Widget extension verified"
          ls -lh "${SCHEME}+SideStore.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Nightly-Widget-Fix-v5.1
          path: LiveContainer/LiveContainer+SideStore.ipa
          if-no-files-found: error

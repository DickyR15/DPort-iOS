name: Build LiveContainer Nightly Widget Fix v3 (Pinned SideStore)

# Temporary push trigger to launch one build; remove after the run starts.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build LiveContainer 2026-09-09 + pinned SideStore from 3.8.0
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
      PINNED_LC_SIDESTORE_IPA: https://github.com/LiveContainer/LiveContainer/releases/download/3.8.0/LiveContainer%2BSideStore.ipa
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout LiveContainer 2026-09-09
        uses: actions/checkout@v6
        with:
          repository: LiveContainer/LiveContainer
          ref: 3afa9eb9a53625e9b8bd8b932e5785fd716ad5ae
          path: LiveContainer
          submodules: recursive
          fetch-depth: 1

      - name: Download pinned SideStore from LiveContainer 3.8.0
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../pinned
          curl -fL --retry 3 "$PINNED_LC_SIDESTORE_IPA" -o ../pinned/LiveContainer+SideStore.ipa
          unzip -q ../pinned/LiveContainer+SideStore.ipa -d ../pinned/extracted
          test -d ../pinned/extracted/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
          rm -rf ../pinned/SideStoreApp.framework
          cp -R ../pinned/extracted/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework ../pinned/SideStoreApp.framework
          echo "Pinned SideStore framework prepared"

      - name: Replace Nightly embedded SideStore with stable 3.8.0 SideStore
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/build_github.sh')
          s = p.read_text()
          start = s.index('# download SideStore')
          end = s.index('# copy intents')
          replacement = '''# SideStore pinned from LiveContainer 3.8.0 stable
rm -rf ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
cp -R ../pinned/SideStoreApp.framework ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
ldid -S\"\" ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore
cp ./.github/sidelc/LCAppInfo.plist ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/

'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Set build inputs
        working-directory: LiveContainer
        id: build_inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            echo 'filetype_parameter=workspace' >> "$GITHUB_OUTPUT"
            echo "file_to_build=$(ls -d *.xcworkspace | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo 'filetype_parameter=project' >> "$GITHUB_OUTPUT"
            echo "file_to_build=$(ls -d *.xcodeproj | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        working-directory: LiveContainer
        env:
          scheme: ${{ steps.build_inputs.outputs.scheme }}
          filetype_parameter: ${{ steps.build_inputs.outputs.filetype_parameter }}
          file_to_build: ${{ steps.build_inputs.outputs.file_to_build }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release | xcpretty
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package IPA
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          sh .github/build_github.sh

      - name: Verify embedded SideStore
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/Info.plist || true
          strings Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore | grep -m1 '0.6.4-' || true

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Nightly-Widget-Fix-v3
          path: |
            LiveContainer/*.ipa
          if-no-files-found: error

name: Build LiveContainer Nightly Widget Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
      - name: Checkout LiveContainer 2026-09-09
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          ref: 3afa9eb
          path: LiveContainer
          submodules: recursive
      - name: Apply Widget fix
        working-directory: LiveContainer
        run: |
          set -e
          grep -q 'AltWidgetExtension.appex' .github/build_github.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/build_github.sh')
          s=p.read_text()
          marker='mv ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/PlugIns/AltWidgetExtension.appex ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex\n'
          fix='cp -r ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/Frameworks ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/\n'
          if fix not in s:
              s=s.replace(marker, marker+fix)
          p.write_text(s)
          PY
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Archive
        working-directory: LiveContainer
        run: |
          set -o pipefail
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release | xcpretty
      - name: Package IPA
        working-directory: LiveContainer
        run: |
          sh .github/build_github.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Nightly-Widget-Fix
          path: LiveContainer/*.ipa

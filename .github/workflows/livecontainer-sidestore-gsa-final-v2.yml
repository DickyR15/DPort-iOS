name: Build LiveContainer + SideStore GSA Final v2

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LC e55609b + SS 9b015d1f + GSA fix
    runs-on: macos-26
    env:
      LC_COMMIT: e55609bab48a2b0551ddb5c0574497826e39680f
      SS_COMMIT: 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
      LC_SCHEME: LiveContainer
      LC_ARCHIVE: archive
      FINAL_NAME: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f.ipa

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ldid xcbeautify
      - name: Select Xcode 26.4 for SideStore
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Clone SideStore 9b015d1f
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/SideStore/SideStore.git SideStore
          cd SideStore
          git fetch --depth=1 origin "$SS_COMMIT"
          git checkout --detach "$SS_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$SS_COMMIT"
          echo "SideStore: $(git rev-parse HEAD)"
          echo "SideSign: $(git -C Dependencies/SideSign rev-parse HEAD)"
      - name: Apply GSA transport fix to current SideSign
        working-directory: SideStore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          auth = Path('Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift')
          text = auth.read_text()
          old = '''        let (data, response): (Data, URLResponse)\n        do {\n            (data, response) = try await session.data(for: request)\n        } catch {\n'''
          new = '''        let (data, response): (Data, URLResponse)\n        do {\n            if let operation = requestParameters["o"] as? String,\n               ["init", "complete", "apptokens"].contains(operation) {\n                (data, response) = try await GrandSlamTransport.data(for: request)\n            } else {\n                (data, response) = try await session.data(for: request)\n            }\n        } catch {\n'''
          if old not in text:
              raise SystemExit('Authentication.swift target block not found')
          auth.write_text(text.replace(old, new, 1))
          PY
          cat > Dependencies/SideSign/Sources/DeveloperPortal/GrandSlamTransport.swift <<'SWIFT'
          import Foundation
          #if canImport(FoundationNetworking)
          import FoundationNetworking
          #endif
          enum GrandSlamTransport {
              static func data(
                  for request: URLRequest,
                  makeSession: @Sendable (URLSessionConfiguration) -> URLSession = { URLSession(configuration: $0) },
                  sleep: @Sendable (UInt64) async throws -> Void = { try await Task.sleep(nanoseconds: $0) }
              ) async throws -> (Data, URLResponse) {
                  let retryDelays: [UInt64] = [1, 2, 4, 8]
                  var attempt = 0
                  while true {
                      try Task.checkCancellation()
                      let configuration = URLSessionConfiguration.ephemeral
                      configuration.urlCache = nil
                      configuration.httpCookieStorage = nil
                      configuration.urlCredentialStorage = nil
                      configuration.requestCachePolicy = .reloadIgnoringLocalCacheData
                      let session = makeSession(configuration)
                      let result: (Data, URLResponse)
                      do {
                          defer { session.finishTasksAndInvalidate() }
                          result = try await session.data(for: request)
                      }
                      try Task.checkCancellation()
                      guard let response = result.1 as? HTTPURLResponse,
                            (500...599).contains(response.statusCode) else {
                          return result
                      }
                      guard attempt < retryDelays.count else {
                          throw NSError(
                              domain: NSURLErrorDomain,
                              code: NSURLErrorBadServerResponse,
                              userInfo: [
                                  NSLocalizedDescriptionKey: "Apple's authentication server returned HTTP \(response.statusCode) after \(attempt + 1) attempts.",
                                  "HTTPStatusCode": response.statusCode,
                                  "ContentType": response.value(forHTTPHeaderField: "Content-Type") ?? "unknown"
                              ]
                          )
                      }
                      try await sleep(retryDelays[attempt] * 1_000_000_000)
                      attempt += 1
                  }
              }
          }
          SWIFT
          grep -n "GrandSlamTransport.data" Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift
      - name: Build patched SideStore IPA
        working-directory: SideStore
        shell: bash
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build.log
          make ipa 2>&1 | tee -a build.log
          test -s SideStore.ipa
          unzip -tq SideStore.ipa
          ls -lh SideStore.ipa
      - name: Select Xcode 26.2 for LiveContainer
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"
      - name: Clone LiveContainer e55609b
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/LiveContainer/LiveContainer.git LiveContainer
          cd LiveContainer
          git fetch --depth=1 origin "$LC_COMMIT"
          git checkout --detach "$LC_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$LC_COMMIT"
          echo "LiveContainer: $(git rev-parse HEAD)"
      - name: Archive LiveContainer e55609b
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -archivePath "$LC_ARCHIVE" \
            -scheme "$LC_SCHEME" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
          test -d "$LC_ARCHIVE.xcarchive/Products/Applications/LiveContainer.app"
      - name: Patch official LiveContainer packaging script to use patched SideStore
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/build_github.sh')
          s = p.read_text()
          start = s.index('# download SideStore')
          end = s.index('# copy intents')
          replacement = '''# SideStore 9b015d1f with GSA transport fix\ncd tmp\ncp "$GITHUB_WORKSPACE/SideStore/SideStore.ipa" SideStore.ipa\nunzip -oq SideStore.ipa\ncd ..\n\n# SideStore\nmv ./tmp/Payload/SideStore.app ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework\n./dylibify ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore.dylib\nrm ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\nmv ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore.dylib ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\nldid -S"" ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\ncp ./.github/sidelc/LCAppInfo.plist ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Package final LiveContainer + SideStore IPA
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          wget https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify
          chmod +x dylibify
          archive_path="$LC_ARCHIVE" scheme="$LC_SCHEME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" sh .github/build_github.sh
          test -s "$GITHUB_WORKSPACE/$FINAL_NAME"
      - name: Verify final bundle and widget
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir verify-final
          unzip -oq "$FINAL_NAME" -d verify-final
          test -d verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
          test -f verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore
          test -d verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex
          test -f verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/LiveWidgetExtension
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist
          ls -lh "$FINAL_NAME"
      - name: Upload final integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f
          path: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f.ipa
          if-no-files-found: error

name: Build LiveContainer + SideStore GSA Final v2

on:
  push:
    branches: [ gsa-sidesign-build ]
  workflow_dispatch:

jobs:
  build:
    name: Build LC e55609b + SS 9b015d1f + GSA fix
    runs-on: macos-26
    env:
      LC_COMMIT: e55609bab48a2b0551ddb5c0574497826e39680f
      SS_COMMIT: 9b015d1f0fb0bb6e8cb32e218222bdf511e002b0
      LC_SCHEME: LiveContainer
      LC_ARCHIVE: archive
      FINAL_NAME: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f.ipa

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Select Xcode 26.4 for SideStore
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Clone SideStore 9b015d1f
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/SideStore/SideStore.git SideStore
          cd SideStore
          git fetch --depth=1 origin "$SS_COMMIT"
          git checkout --detach "$SS_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$SS_COMMIT"
          echo "SideStore: $(git rev-parse HEAD)"
          echo "SideSign: $(git -C Dependencies/SideSign rev-parse HEAD)"

      - name: Apply actual GSA 503 client-info fix
        working-directory: SideStore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift')
          s = p.read_text()
          marker = '        let headers: [String: String] = [\n'
          replacement = '''        // Apple began rejecting X-MMe-Client-Info values that identify Xcode.\n        // Report the GrandSlam client as the system akd daemon instead.\n        let patchedClientInfo = anisetteData.clientInfo.replacingOccurrences(\n            of: #"com\\.apple\\.dt\\.Xcode/[^) >]+"#,\n            with: "com.apple.akd/1.0",\n            options: .regularExpression\n        )\n\n        let headers: [String: String] = [\n'''
          if marker not in s:
              raise SystemExit('Authentication.swift headers marker not found')
          s = s.replace(marker, replacement, 1)
          old = '            "X-MMe-Client-Info": anisetteData.clientInfo,\n'
          new = '            "X-MMe-Client-Info": patchedClientInfo,\n'
          if old not in s:
              raise SystemExit('X-MMe-Client-Info header target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -n -A10 -B3 'patchedClientInfo' Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift

      - name: Build patched SideStore IPA
        working-directory: SideStore
        shell: bash
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build.log
          make ipa 2>&1 | tee -a build.log
          test -s SideStore.ipa
          unzip -tq SideStore.ipa
          ls -lh SideStore.ipa

      - name: Select Xcode 26.2 for LiveContainer
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Clone LiveContainer e55609b
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/LiveContainer/LiveContainer.git LiveContainer
          cd LiveContainer
          git fetch --depth=1 origin "$LC_COMMIT"
          git checkout --detach "$LC_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$LC_COMMIT"
          echo "LiveContainer: $(git rev-parse HEAD)"

      - name: Prepare known-working 7-day widget
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../stable-widget ../stable-widget-extracted
          mkdir -p ../stable-widget-extracted
          curl -fL --retry 3 'https://github.com/LiveContainer/LiveContainer/releases/download/3.8.0/LiveContainer%2BSideStore.ipa' -o ../stable-widget.ipa
          unzip -q ../stable-widget.ipa -d ../stable-widget-extracted
          widget="$(find ../stable-widget-extracted/Payload/LiveContainer.app -type d \( -name 'LiveWidgetExtension.appex' -o -name 'AltWidgetExtension.appex' \) -print -quit || true)"
          test -n "$widget"
          cp -R "$widget" ../stable-widget
          echo "Stable widget: $widget"

      - name: Archive LiveContainer e55609b
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -archivePath "$LC_ARCHIVE" \
            -scheme "$LC_SCHEME" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
          test -d "$LC_ARCHIVE.xcarchive/Products/Applications/LiveContainer.app"

      - name: Patch official LiveContainer packaging script
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/build_github.sh')
          s = p.read_text()
          start = s.index('# download SideStore')
          end = s.index('# copy intents')
          replacement = '''# SideStore 9b015d1f with GSA client-info fix\n          cd tmp\n          cp "$GITHUB_WORKSPACE/SideStore/SideStore.ipa" SideStore.ipa\n          unzip -oq SideStore.ipa\n          cd ..\n\n          rm -rf ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework\n          mv ./tmp/Payload/SideStore.app ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework\n          ./dylibify ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore.dylib\n          rm ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\n          mv ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore.dylib ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\n          ldid -S\"\" ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore\n          cp ./.github/sidelc/LCAppInfo.plist ./Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/\n\n          # Restore the known-working widget from stable LiveContainer 3.8.0.\n          rm -rf ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex\n          cp -R "$GITHUB_WORKSPACE/stable-widget" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex\n          if [ -f ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/AltWidgetExtension ]; then\n            mv ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/AltWidgetExtension ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/LiveWidgetExtension\n          fi\n          /usr/libexec/PlistBuddy -c \"Set :CFBundleIdentifier com.kdt.livecontainer.LiveWidget\" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist || /usr/libexec/PlistBuddy -c \"Add :CFBundleIdentifier string com.kdt.livecontainer.LiveWidget\" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist\n          /usr/libexec/PlistBuddy -c \"Set :CFBundleExecutable LiveWidgetExtension\" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist || /usr/libexec/PlistBuddy -c \"Add :CFBundleExecutable string LiveWidgetExtension\" ./Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist\n          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace('find payloadlc/Payload -type d -name "_CodeSignature" -exec rm -r {} +', 'find Payload -type d -name "_CodeSignature" -exec rm -r {} +')
          p.write_text(s)
          PY
          grep -n -A4 -B3 'known-working widget' .github/build_github.sh

      - name: Package final LiveContainer + SideStore IPA
        working-directory: LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify
          chmod +x dylibify
          archive_path="$LC_ARCHIVE" scheme="$LC_SCHEME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" sh .github/build_github.sh
          test -s "${LC_SCHEME}+SideStore.ipa"
          mv "${LC_SCHEME}+SideStore.ipa" "$GITHUB_WORKSPACE/$FINAL_NAME"
          test -s "$GITHUB_WORKSPACE/$FINAL_NAME"
          unzip -tq "$GITHUB_WORKSPACE/$FINAL_NAME"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_NAME"

      - name: Verify final bundle, GSA patch and widget
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir verify-final
          unzip -oq "$FINAL_NAME" -d verify-final
          test -d verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework
          test -f verify-final/Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore
          test -d verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex
          test -f verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/LiveWidgetExtension
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' verify-final/Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/Info.plist
          ls -lh "$FINAL_NAME"

      - name: Upload final integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f
          path: LiveContainer_SideStore_LC-e55609b_SS-9b015d1f.ipa
          if-no-files-found: error

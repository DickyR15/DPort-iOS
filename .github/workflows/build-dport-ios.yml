name: DPort iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick librsvg

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ChrisMack32/Locus.git upstream-locus
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Apply DPort branding and localization
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 ../scripts/apply_dport.py
          python3 ../scripts/apply_dport_build39.py
          python3 ../scripts/fix_localdevvpn_build52.py

      - name: Build current idevice-ffi with multihost RPPairing support
        run: |
          set -euo pipefail
          rm -rf idevice-ffi-build
          git clone --depth 1 https://github.com/jkcoxson/idevice.git idevice-ffi-build
          cd idevice-ffi-build
          git fetch --depth 1 origin 7bd551c16c6dd2e058740d85a2d9399a51a776e9
          git checkout --detach 7bd551c16c6dd2e058740d85a2d9399a51a776e9
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo build --release --target aarch64-apple-ios --manifest-path ffi/Cargo.toml --no-default-features --features full,aws-lc
          test -s ffi/target/aarch64-apple-ios/release/libidevice_ffi.a
          cp ffi/target/aarch64-apple-ios/release/libidevice_ffi.a ../src-build/Vendor/idevice/libidevice_ffi.a
          cp ffi/idevice.h ../src-build/Vendor/idevice/idevice.h
          echo "Using idevice-ffi rev 7bd551c with multihost RPPairing transport"

      - name: Install DPort app icon
        run: |
          set -euo pipefail
          mkdir -p src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/DPort-AppIcon.svg -o src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild             -project DPort.xcodeproj             -scheme DPort             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=             build

      - name: Set DPort version to Build 62
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          s=p.read_text()
          import re
          s=re.sub(r'CURRENT_PROJECT_VERSION:\s*"\d+"', 'CURRENT_PROJECT_VERSION: "62"', s, count=1)
          p.write_text(s)
          PY
          grep 'CURRENT_PROJECT_VERSION' project.yml

      - name: Package DPort 6.9.5 Build 62 IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload DPort-6.9.5-Build61-TW.ipa DPort-6.9.5-Build61-TW.zip DPort-6.9.5-Build61-TW.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app
          zip -qry DPort-6.9.5-Build61-TW.ipa Payload/DPort.app
          unzip -t DPort-6.9.5-Build61-TW.ipa
          cp DPort-6.9.5-Build61-TW.ipa DPort-6.9.5-Build61-TW.zip
          shasum -a 256 DPort-6.9.5-Build61-TW.ipa > DPort-6.9.5-Build61-TW.sha256
          test -s DPort-6.9.5-Build61-TW.ipa
          test -s DPort-6.9.5-Build61-TW.zip
          test -s DPort-6.9.5-Build61-TW.sha256
          ls -lh DPort-6.9.5-Build61-TW.ipa DPort-6.9.5-Build61-TW.zip DPort-6.9.5-Build61-TW.sha256

      - name: Upload DPort 6.9.5 Build 62
        uses: actions/upload-artifact@v7
        with:
          name: DPort-6.9.5-Build61-TW
          path: |
            src-build/DPort-6.9.5-Build61-TW.ipa
            src-build/DPort-6.9.5-Build61-TW.zip
            src-build/DPort-6.9.5-Build61-TW.sha256
          if-no-files-found: error

name: DPort iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ChrisMack32/Locus.git upstream-locus
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Apply DPort branding
        working-directory: src-build
        run: python3 ../scripts/apply_dport.py

      - name: Install DPort app icon
        run: |
          set -euo pipefail
          mkdir -p src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/DPort-AppIcon.svg \
            -o src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild \
            -project DPort.xcodeproj \
            -scheme DPort \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload DPort-iOS-unsigned.ipa DPort-iOS-unsigned.zip DPort-iOS-unsigned.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app

          # Build a standard IPA (ZIP container) and verify it before upload.
          ditto -c -k --sequesterRsrc --keepParent Payload DPort-iOS-unsigned.ipa
          unzip -t DPort-iOS-unsigned.ipa
          unzip -l DPort-iOS-unsigned.ipa | head -25

          # A second copy with a .zip extension is easier to recognize/extract.
          cp DPort-iOS-unsigned.ipa DPort-iOS-unsigned.zip
          shasum -a 256 DPort-iOS-unsigned.ipa > DPort-iOS-unsigned.sha256

          # Final integrity checks.
          test -s DPort-iOS-unsigned.ipa
          test -s DPort-iOS-unsigned.zip
          test -s DPort-iOS-unsigned.sha256
          ls -lh DPort-iOS-unsigned.ipa DPort-iOS-unsigned.zip DPort-iOS-unsigned.sha256

      - name: Upload DPort IPA
        uses: actions/upload-artifact@v7
        with:
          name: DPort-iOS-unsigned
          path: |
            DPort-iOS-unsigned.ipa
            DPort-iOS-unsigned.zip
            DPort-iOS-unsigned.sha256
          if-no-files-found: error

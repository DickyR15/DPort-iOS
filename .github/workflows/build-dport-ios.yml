name: DPort iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick librsvg

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          git clone https://github.com/ChrisMack32/Locus.git upstream-locus
          cd upstream-locus
          git checkout c1cc43dcf33420f03ebb900ad748c1f82e97154b
          cd ..
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Apply DPort branding and localization
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 ../scripts/apply_dport_build39.py

      - name: Set DPort version to Build 65
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('project.yml')
          s=p.read_text()
          s=re.sub(r'CURRENT_PROJECT_VERSION:\s*"\d+"', 'CURRENT_PROJECT_VERSION: "65"', s, count=1)
          p.write_text(s)
          PY
          grep 'CURRENT_PROJECT_VERSION' project.yml

      - name: Install DPort app icon
        run: |
          set -euo pipefail
          mkdir -p src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/DPort-AppIcon.svg -o src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild             -project Locus.xcodeproj             -scheme Locus             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=             build

      - name: Package DPort 6.9.5 Build 65 IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload DPort-6.9.5-Build65-TW.ipa DPort-6.9.5-Build65-TW.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app
          zip -qry DPort-6.9.5-Build65-TW.ipa Payload/DPort.app
          unzip -t DPort-6.9.5-Build65-TW.ipa
          shasum -a 256 DPort-6.9.5-Build65-TW.ipa > DPort-6.9.5-Build65-TW.sha256
          test -s DPort-6.9.5-Build65-TW.ipa
          test -s DPort-6.9.5-Build65-TW.sha256
          ls -lh DPort-6.9.5-Build65-TW.ipa DPort-6.9.5-Build65-TW.sha256

      - name: Upload DPort 6.9.5 Build 65
        uses: actions/upload-artifact@v7
        with:
          name: DPort-6.9.5-Build65-TW
          path: |
            src-build/DPort-6.9.5-Build65-TW.ipa
            src-build/DPort-6.9.5-Build65-TW.sha256
          if-no-files-found: error

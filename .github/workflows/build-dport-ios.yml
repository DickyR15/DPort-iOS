name: DPort iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick librsvg

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ChrisMack32/Locus.git upstream-locus
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Apply DPort branding and localization
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 ../scripts/apply_dport.py
          python3 ../scripts/apply_dport_build39.py
          python3 ../scripts/fix_localdevvpn_build52.py

      - name: Set DPort version to Build 64
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('project.yml')
          s=p.read_text()
          s=re.sub(r'CURRENT_PROJECT_VERSION:\s*"\d+"', 'CURRENT_PROJECT_VERSION: "64"', s, count=1)
          p.write_text(s)
          PY
          grep 'CURRENT_PROJECT_VERSION' project.yml

      - name: Install DPort app icon
        run: |
          set -euo pipefail
          mkdir -p src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/DPort-AppIcon.svg -o src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild             -project DPort.xcodeproj             -scheme DPort             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=             build

      - name: Package DPort 6.9.5 Build 64 IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload DPort-6.9.5-Build64-TW.ipa DPort-6.9.5-Build64-TW.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app
          zip -qry DPort-6.9.5-Build64-TW.ipa Payload/DPort.app
          unzip -t DPort-6.9.5-Build64-TW.ipa
          shasum -a 256 DPort-6.9.5-Build64-TW.ipa > DPort-6.9.5-Build64-TW.sha256
          test -s DPort-6.9.5-Build64-TW.ipa
          test -s DPort-6.9.5-Build64-TW.sha256
          ls -lh DPort-6.9.5-Build64-TW.ipa DPort-6.9.5-Build64-TW.zip DPort-6.9.5-Build64-TW.sha256

      - name: Upload DPort 6.9.5 Build 64
        uses: actions/upload-artifact@v7
        with:
          name: DPort-6.9.5-Build64-TW
          path: |
            src-build/DPort-6.9.5-Build64-TW.ipa
            src-build/DPort-6.9.5-Build64-TW.sha256
          if-no-files-found: error

      - name: Publish direct IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dport-build-64"
          IPA="src-build/DPort-6.9.5-Build64-TW.ipa"
          SHA="src-build/DPort-6.9.5-Build64-TW.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --clobber
          else
            gh release create "$TAG" "$IPA" "$SHA" --title "DPort 6.9.5 Build 64" --notes "DPort Build 64 — restore the known-working pre-Build60 LocationEngine/RPPairing path. Direct IPA; no nested ZIP."
          fi

name: DPort iOS 6.9.0 — Joystick/VPN Fix
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick librsvg

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          LocusRef="83c8fb324983728e8f44759cfd834dc637ee38b5"
          git clone --filter=blob:none --no-checkout https://github.com/ChrisMack32/Locus.git upstream-locus
          git -C upstream-locus checkout --detach "$LocusRef"
          test "$(git -C upstream-locus rev-parse HEAD)" = "$LocusRef"
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Validate build scripts
        run: python3 -m compileall -q scripts

      - name: Apply DPort branding and localization
        working-directory: src-build
        run: |
          set -euo pipefail
          python3 ../scripts/apply_dport.py
          python3 ../scripts/apply_dport_build39.py
          python3 ../scripts/fix_localdevvpn_build52.py
          python3 ../scripts/fix_ui_build69.py
          # Build guard: the third top map button must be Nearby Places, not draw mode.
          echo "---- MapHomeView toolbar after patches ----"
          nl -ba Locus/Features/Map/MapHomeView.swift | sed -n '260,305p'
          echo "-------------------------------------------"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Locus/Features/Map/MapHomeView.swift")
          t = p.read_text(encoding="utf-8")
          toolbar_start = t.find('private var mapChromeButtons: some View')
          toolbar_end = t.find('private var locateButton: some View', toolbar_start)
          toolbar = t[toolbar_start:toolbar_end]
          nearby = toolbar.find('showNearbyPlaces = true')
          drawing = toolbar.find('drawMode.toggle()')
          assert nearby >= 0, "Nearby Places action was not applied"
          assert drawing > nearby, "Drawing action appears after Nearby Places"
          drawing_button = toolbar.find('chromeIconButton(drawMode ?', nearby)
          nearby_block = toolbar[nearby:nearby+260]
          assert 'drawMode' not in nearby_block, "Nearby Places action touches drawMode"
          assert 'chromeIconButton(drawMode ?' in toolbar, "Map drawing button was not restored"
          assert 'star.circle' not in toolbar, "Top toolbar must not replace Drawing with Favorites"
          assert toolbar.count('chromeIconButton(') == 3, "Expected 3 chromeIconButton controls plus the explicit Nearby Places Button"
          assert toolbar.count('Button {') >= 1, "Nearby Places Button missing"
          print("DPort Nearby Places / Map Drawing fixed-toolbar guard: PASS")
          PY

      - name: Hide internal build number from DPort version display
        working-directory: src-build
        run: python3 ../scripts/hide_build_number.py

      - name: Prepare FFI from upstream baseline
        run: |
          set -euo pipefail
          test -s src-build/Vendor/idevice/libidevice_ffi.a
          test -s src-build/Vendor/idevice/idevice.h

      - name: Install DPort app icon
        run: |
          set -euo pipefail
          mkdir -p src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/DPort-AppIcon.svg -o src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s src-build/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Debug map pin source
        working-directory: src-build
        run: |
          echo "---- MapHomeView pin/map source ----"
          nl -ba Locus/Features/Map/MapHomeView.swift | sed -n '35,115p'
          echo "-------------------------------------"
      - name: Debug patched MapHomeView
        working-directory: src-build
        run: |
          echo "---- patched MapHomeView 255-305 ----"
          nl -ba Locus/Features/Map/MapHomeView.swift | sed -n '255,305p'
          echo "--------------------------------------"
      - name: Validate generated DPort metadata
        working-directory: src-build
        run: |
          set -euo pipefail
          test -f Locus/Resources/Info.plist
          test -f Locus/Resources/zh-Hant.lproj/Localizable.strings || true
          echo "Pinned Locus: $(git -C ../upstream-locus rev-parse HEAD)"
          grep -q 'MARKETING_VERSION: "6.9.0"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "1"' project.yml

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild             -project DPort.xcodeproj             -scheme DPort             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=             build

      - name: Package DPort 6.9.0 IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload DPort-6.9.0-TW.ipa DPort-6.9.0-TW.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app
          zip -qry DPort-6.9.0-TW.ipa Payload/DPort.app
          unzip -t DPort-6.9.0-TW.ipa
          shasum -a 256 DPort-6.9.0-TW.ipa > DPort-6.9.0-TW.sha256
          test -s DPort-6.9.0-TW.ipa
          test -s DPort-6.9.0-TW.sha256
          ls -lh DPort-6.9.0-TW.ipa DPort-6.9.0-TW.sha256

      - name: Upload DPort 6.9.0
        uses: actions/upload-artifact@v7
        with:
          name: DPort-6.9.0-TW
          path: |
            src-build/DPort-6.9.0-TW.ipa
            src-build/DPort-6.9.0-TW.sha256
          if-no-files-found: error

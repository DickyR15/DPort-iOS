name: DPort iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DPort unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch upstream Locus source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ChrisMack32/Locus.git upstream-locus
          mkdir -p src-build
          rsync -a --exclude='.git' upstream-locus/ src-build/

      - name: Apply DPort branding
        working-directory: src-build
        run: python3 ../scripts/apply_dport.py

      - name: Generate Xcode project
        working-directory: src-build
        run: xcodegen generate

      - name: Build unsigned DPort app
        working-directory: src-build
        run: |
          set -euo pipefail
          xcodebuild \
            -project DPort.xcodeproj \
            -scheme DPort \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package IPA
        working-directory: src-build
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DPort.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DPort.app
          zip -qry ../DPort-iOS-unsigned.ipa Payload
          cd ..
          unzip -l DPort-iOS-unsigned.ipa | head -25
          ls -lh DPort-iOS-unsigned.ipa

      - name: Upload DPort IPA
        uses: actions/upload-artifact@v7
        with:
          name: DPort-iOS-unsigned
          path: DPort-iOS-unsigned.ipa
          if-no-files-found: error
